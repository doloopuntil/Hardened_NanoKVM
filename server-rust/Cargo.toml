[package]
name = "nanokvm-rust-server"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[features]
default = []
linked-libkvm = []

[dependencies]
aes = "0.8"
argon2 = "0.6"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "multipart", "ws"] }
base64 = "0.23"
bcrypt = "0.19.3"
bytes = "1"
cbc = "0.1"
cipher = "0.4"
# Already present in Cargo.lock as transitive dependencies of the webrtc/rcgen
# graph; promoted to direct dependencies for the TOTP implementation.
data-encoding = "2.11"
flate2 = "1"
hmac = "0.12"
getrandom = "0.4"
futures-util = { version = "0.3.32", features = ["sink"] }
md-5 = "0.10"
nix = { version = "0.31.3", features = ["fs", "ioctl", "mount", "net", "process", "signal", "term"] }
rcgen = "0.14"
# Types webrtc takes from its sans-I/O core; pinned with webrtc.
rtc = { version = "=0.21.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9.42"
sha1 = "0.10"
sha2 = "0.11"
subtle = "2.6"
tar = "0.4"
thiserror = "2"
time = { version = "0.3.51", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "0.29.0"
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
urlencoding = "2"
webrtc = "=0.21.1"
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls"] }

[dev-dependencies]
tempfile = "3"
# Already in Cargo.lock via axum; used to drive the real router in tests.
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Video passes through these: TLS/WebSocket for Direct, SRTP for WebRTC. The rest
# stays at "z" because the binary runs from tmpfs.
[profile.release.package]
ring = { opt-level = 3 }
rustls = { opt-level = 3 }
tungstenite = { opt-level = 3 }
tokio-tungstenite = { opt-level = 3 }
rtc-srtp = { opt-level = 3 }
rtc-crypto = { opt-level = 3 }
aes = { opt-level = 3 }
ctr = { opt-level = 3 }
hmac = { opt-level = 3 }
sha1 = { opt-level = 3 }
