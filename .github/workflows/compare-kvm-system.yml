name: Compare kvm_system builds

# One-off check: rebuild kvm_system from the RC10 source (26a2986) with the image build's pins and
# compare it with the binary published in app 2.0.42, then build this ref's source for the same
# report. Remove this workflow once the comparison has been reviewed.

# workflow_dispatch needs the file on the default branch, so pushes to this file run it too.
on:
  workflow_dispatch: {}
  push:
    branches: [feat/hardened-system-0.4.0-full]
    paths: [.github/workflows/compare-kvm-system.yml]

env:
  MAIXCDK_SHA: 5b0aa5b1a8c91d213433189cfab8c999775fa13a
  SOPHGO_HOST_TOOLS_URL: https://sophon-file.sophon.cn/sophon-prod-s3/drive/23/03/07/16/host-tools.tar.gz
  SOPHGO_HOST_TOOLS_SHA256: ff9a58e8e192b20ea42e1d729c42d2219523209706cb3f0cf134582f6c70f805
  RC10_SHA: 26a2986d3080cb95557f06fde437c1de6189f491
  KVMAPP_2_0_42_ARCHIVE_URL: https://github.com/woffko/Hardened_NanoKVM/releases/download/hardened-system-0.3.0-raw.12/hardened-nanokvm-kvmapp-2.0.42.tar.gz
  KVMAPP_2_0_42_ARCHIVE_SHA256: aa0cd78c1b2e9951f216826c44b4b7ff2fb211fc1980540366f8f5b1f7e0dd20

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout this ref
        uses: actions/checkout@v4
        with:
          path: head

      - name: Checkout the RC10 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RC10_SHA }}
          path: rc10

      # RC10's build script hard-codes the maintainer's paths; the source it builds is what counts.
      - name: Use this ref's build script for the RC10 tree
        run: cp head/support/sg2002/build rc10/support/sg2002/build

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git curl python3 python3-venv python3-pip \
            autoconf automake libtool patchelf patch file

      - name: Install Sophgo RISC-V musl toolchain
        run: |
          curl --fail --location --retry 2 \
            --output /tmp/host-tools.tar.gz "$SOPHGO_HOST_TOOLS_URL"
          echo "$SOPHGO_HOST_TOOLS_SHA256  /tmp/host-tools.tar.gz" | sha256sum -c -
          sudo tar -C /usr/local -xzf /tmp/host-tools.tar.gz
          rm -f /tmp/host-tools.tar.gz
          echo "/usr/local/host-tools/gcc/riscv64-linux-musl-x86_64/bin" >> "$GITHUB_PATH"

      # One MaixCDK per tree: ./build copies each tree's components into MaixCDK on first use.
      - name: Fetch MaixCDK twice
        run: |
          for tree in rc10 head; do
            dir="$HOME/MaixCDK-$tree"
            mkdir -p "$dir"
            git -C "$dir" init -q
            git -C "$dir" remote add origin https://github.com/sipeed/MaixCDK.git
            git -C "$dir" fetch --depth 1 origin "$MAIXCDK_SHA"
            git -C "$dir" checkout -q FETCH_HEAD
            python3 -m venv "$dir"
            "$dir/bin/pip" install -U -r "$dir/requirements.txt"
          done

      - name: Build kvm_system from both trees
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          for tree in rc10 head; do
            (
              export MAIXCDK_PATH="$HOME/MaixCDK-$tree"
              export PATH="$MAIXCDK_PATH/bin:$PATH"
              cd "$GITHUB_WORKSPACE/$tree/support/sg2002"
              ./build kvm_system
            )
            cp "$GITHUB_WORKSPACE/$tree/support/sg2002/kvm_system/dist/kvm_system_release/kvm_system" \
              "$GITHUB_WORKSPACE/out/kvm_system.$tree"
          done

      - name: Fetch the published 2.0.42 kvm_system
        run: |
          curl --fail --location --retry 2 \
            --output /tmp/kvmapp-2.0.42.tar.gz "$KVMAPP_2_0_42_ARCHIVE_URL"
          echo "$KVMAPP_2_0_42_ARCHIVE_SHA256  /tmp/kvmapp-2.0.42.tar.gz" | sha256sum -c -
          mkdir -p /tmp/kvmapp-2.0.42
          tar -xzf /tmp/kvmapp-2.0.42.tar.gz -C /tmp/kvmapp-2.0.42 kvmapp/kvm_system/kvm_system
          cp /tmp/kvmapp-2.0.42/kvmapp/kvm_system/kvm_system "$GITHUB_WORKSPACE/out/kvm_system.published"

      - name: Compare
        run: |
          cd "$GITHUB_WORKSPACE/out"
          STRIP="$(ls /usr/local/host-tools/gcc/riscv64-linux-musl-x86_64/bin/*-strip | head -n 1)"
          for b in published rc10 head; do
            cp "kvm_system.$b" "stripped.$b"
            "$STRIP" "stripped.$b" 2>/dev/null || true
            strings -n 6 "stripped.$b" | sort -u > "strings.$b"
            readelf -SW "stripped.$b" | sed 's/^ *\[ *[0-9]*\] *//' | awk '$1 ~ /^\./ { print $1, $5 }' | sort > "sections.$b"
          done

          {
            echo '## kvm_system builds'
            echo
            echo '```text'
            for b in published rc10 head; do
              echo "== $b"
              sha256sum "kvm_system.$b"
              file "kvm_system.$b"
              echo "stripped size: $(stat -c %s "stripped.$b")"
              readelf -l "kvm_system.$b" | grep interpreter || true
              readelf -d "kvm_system.$b" | grep -E 'NEEDED|RPATH|RUNPATH' || true
            done
            echo
            echo '== section sizes (published / rc10 / head)'
            join -a1 -a2 -e - -o 0,1.2,2.2 sections.published sections.rc10 \
              | join -a1 -a2 -e - -o 0,1.2,1.3,2.2 - sections.head
            echo
            echo '== strings only in published (vs rc10)'
            comm -23 strings.published strings.rc10
            echo
            echo '== strings only in rc10 (vs published)'
            comm -13 strings.published strings.rc10
            echo
            echo '== strings only in head (vs rc10)'
            comm -13 strings.rc10 strings.head
            echo
            echo '== strings only in rc10 (vs head)'
            comm -23 strings.rc10 strings.head
            echo '```'
          } | tee report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload binaries and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kvm-system-comparison
          path: out/**
          retention-days: 14
          if-no-files-found: warn
