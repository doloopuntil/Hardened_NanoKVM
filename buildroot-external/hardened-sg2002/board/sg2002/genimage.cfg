image boot.vfat {
	vfat {
		label = "boot"
		extraargs = "--invariant"
		files = {
			"fip.bin",
			"fip.std.bin",
			"fip.od.bin",
			"rawimages/boot.sd",
			"usb.dev",
			"usb.disk0",
			"usb.rndis0",
			"wifi.sta",
			"gt9xx",
			"logo.jpeg",
			"ver",
		}
	}
	# the kernel package alone is about 12 MB; a system update writes the whole image, so a card
	# keeps the boot size it was flashed with
	size = 32M
}

image hardened-sg2002-port.img {
	hdimage {
	}

	partition boot {
		partition-type = 0x0C
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.sd"
		# the filesystem is smaller; S01fs grows it into the partition at boot
		size = 1536M
	}
}
