image boot.vfat {
	vfat {
		label = "boot"
		extraargs = "--invariant"
	}
	# same size as the 5.10 images, so a system update can write it
	size = 32M
}

# Same partition layout as the 5.10 image: the raw updater writes boot.vfat and rootfs.ext4
# to partitions 1 and 2, and S01fs creates the exFAT /data partition at first boot.
image hardened-sg2002-6x.img {
	hdimage {
	}

	partition boot {
		partition-type = 0x0C
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
		# the filesystem is smaller; S01fs grows it into the partition at boot
		size = 1536M
	}
}
